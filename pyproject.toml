[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-demo-local"
version = "0.1.0"
description = "Local scripts for dataset preprocessing and generation."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0.1,<2",
    "langchain-core>=0.3.0,<1",
    "langchain-openai>=0.3.0,<1",
    "langchain-openrouter>=0.1.0,<1",
    "langchain-ollama>=0.3.0,<1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["preprocess*", "dataset*"]
