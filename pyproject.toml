[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-demo-local"
version = "0.1.0"
description = "Local scripts for dataset preprocessing and generation."
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "python-dotenv",
    "langchain-core",
    "langchain-openai",
    "langchain-openrouter",
    "langchain-ollama",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["preprocess*", "dataset*"]
